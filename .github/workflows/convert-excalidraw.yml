name: Convert Excalidraw to SVG and PNG

on:
  push:
    paths:
      - '**/*.excalidraw'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2  # Fetch the last two commits

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: |
        npm install sharp canvas xmlserializer jsdom@16.7.0

    - name: Convert Excalidraw to SVG and PNG
      run: |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.excalidraw$')
        for file in $CHANGED_FILES; do
          node utils/convert-excalidraw.js "$file" "${file%.excalidraw}.svg" "${file%.excalidraw}.png"
        done

    - name: Commit and push changes
      if: success()  # Only run this step if the previous steps were successful
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m 'Convert Excalidraw files to SVG and PNG'
        git push