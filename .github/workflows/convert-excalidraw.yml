name: Convert Excalidraw to SVG and PNG

on:
  push:
    paths:
      - '**/*.excalidraw'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install -g excalidraw-to-svg

    - name: Convert Excalidraw to SVG and PNG
      run: |
        for file in $(find . -name "*.excalidraw"); do
          npx excalidraw-to-svg "$file" "${file%.excalidraw}.svg"
          npx excalidraw-to-svg "$file" "${file%.excalidraw}.png"
        done

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m 'Convert Excalidraw files to SVG and PNG'
        git push