name: Convert Excalidraw to SVG and PNG

on:
  push:
    paths:
      - '**/*.excalidraw'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Convert Excalidraw to SVG and PNG
        run: |
          node utils/convert-excalidraw.js

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Convert Excalidraw to SVG and PNG [skip ci]" || echo "No changes to commit"
          git push