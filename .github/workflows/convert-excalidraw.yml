name: Convert Excalidraw to SVG and PNG

on:
  push:
    paths:
      - '**/*.excalidraw'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install -g @excalidraw/excalidraw-cli

      - name: Convert Excalidraw to SVG and PNG
        run: |
          for file in $(git diff --name-only HEAD^ HEAD | grep -E '\.excalidraw$'); do
            excalidraw-cli export --input $file --output ${file%.excalidraw}.svg
            excalidraw-cli export --input $file --output ${file%.excalidraw}.png --format png
            git add ${file%.excalidraw}.svg ${file%.excalidraw}.png
          done

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Convert Excalidraw to SVG and PNG [skip ci]" || echo "No changes to commit"
          git push